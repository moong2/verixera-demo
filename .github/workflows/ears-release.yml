# EARS 릴리스(이 앱이 넣은 파일): release/<폴더>/v<주.부.수> 태그를 올리면 게이트를 다시 통과시킨 뒤 묶음을 발행한다.
name: ears-release

on:
  push:
    tags:
      - "release/*/v*"

permissions:
  contents: write

env:
  TRACE_ENV_IMAGE: node:22.23.5-trixie@sha256:c103d7b5aa3bf627c8b98db941d52556f04e0b5d9352b3d7b6391245d26620f8

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:22.23.5-trixie@sha256:c103d7b5aa3bf627c8b98db941d52556f04e0b5d9352b3d7b6391245d26620f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: 실행 환경 기록
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "image: $TRACE_ENV_IMAGE"
          node --version
          cc --version | head -n 1

      - name: 도구 설치 (버전 고정) — 정적 분석과 프로젝트가 고른 컴파일러
        run: |
          compilers="$(node .ears/tools/project/compilers.js --ci-packages . --list)"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cppcheck=2.17.1-2 $compilers
          cppcheck --version

      - name: 게이트 통과 확인과 릴리스 묶음 만들기
        run: node .ears/tools/release/make-release.js --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --targets . --out release-out

      - name: 릴리스 발행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .ears/tools/release/publish.js --tag "$GITHUB_REF_NAME" --dir release-out

      - name: 게이트 결과 보관 (실패해도)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: trace-out
          path: "*/trace-out/"
          if-no-files-found: ignore
