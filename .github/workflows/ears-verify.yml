# EARS 검증(이 앱이 넣은 파일): 이 저장소의 프로젝트 폴더(<폴더>/requirements/baseline 이 있는 것)마다 게이트를 돌린다.
# 도구는 .ears/ 에 있고, 이미지·액션·Cppcheck 는 해시·정확한 버전으로 고정했다. 비밀 값을 쓰지 않고 저장소 읽기 권한만 쓴다.
name: ears-verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRACE_ENV_IMAGE: node:22.23.5-trixie@sha256:c103d7b5aa3bf627c8b98db941d52556f04e0b5d9352b3d7b6391245d26620f8

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: node:22.23.5-trixie@sha256:c103d7b5aa3bf627c8b98db941d52556f04e0b5d9352b3d7b6391245d26620f8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: 실행 환경 기록
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "image: $TRACE_ENV_IMAGE"
          node --version
          cc --version | head -n 1
          make --version | head -n 1

      - name: 도구 설치 (버전 고정) — 정적 분석과 프로젝트가 고른 컴파일러
        run: |
          compilers="$(node .ears/tools/project/compilers.js --ci-packages . --list)"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cppcheck=2.17.1-2 $compilers
          cppcheck --version

      - name: 프로젝트 게이트 (실제 C 빌드와 시험)
        run: |
          status=0
          found=0
          for dir in */; do
            [ -d "${dir}requirements/baseline" ] || continue
            found=1
            node .ears/tools/trace/run-gate.js --root "$dir" --commit "$GITHUB_SHA" || status=1
          done
          [ "$found" = 1 ] || echo "고정본이 있는 프로젝트 폴더가 아직 없습니다."
          exit $status

      - name: 추적 결과 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: trace-out
          path: "*/trace-out/"
          if-no-files-found: ignore
